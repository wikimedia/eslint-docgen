# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Turn off autocrlf for Windows testing
      run: |
        git config --global core.autocrlf false
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

  eslint-9:
    # Plugins using ESLint 9 use eslint-docgen with ESLint 9's RuleTester
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 24.x
      uses: actions/setup-node@v1
      with:
        node-version: 24.x
    - run: npm ci
    # TODO: Remove --legacy-peer-deps, and run all tests with ESLint 9, once
    # this repo's own lint config (eslint-config-wikimedia) supports it
    - run: npm install --no-save --legacy-peer-deps eslint@9
    - run: npx nyc mocha tests/
